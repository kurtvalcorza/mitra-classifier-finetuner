name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn huggingface_hub requests pytest
      - name: Compile
        run: python -m py_compile train.py contract_hardening.py contract_entrypoint.py scripts/integration_smoke.py
      - name: Shared block (cross-repo parity)
        run: python scripts/check_shared.py
      - name: DIMER contract
        run: python scripts/check_contract.py
      - name: Unit tests
        run: python -m pytest tests/ -q
